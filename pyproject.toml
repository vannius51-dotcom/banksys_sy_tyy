[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "N999",   # Streamlit pages use emoji in file names
    "BLE001", # catching Exception is intentional for user-facing error display
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
