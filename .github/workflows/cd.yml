name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            APP="banksys_sy_tyy"
            DEPLOY_DIR="/opt/${APP}"
            PORT_START=8899
            PORT_END=8910
            CONTAINER_PORT=8501

            # Ensure deploy directory exists
            mkdir -p "${DEPLOY_DIR}"

            # rsync source code to server
            echo ">> Syncing code to ${DEPLOY_DIR} ..."
            # Note: rsync from the checkout dir is handled by copying within the SSH session.
            # We use a simpler approach: git pull on the server, or copy via scp.
            # For simplicity, we assume code was already synced — in a real setup,
            # you'd use rsync from the runner. Here we do a server-side git pull.
            cd "${DEPLOY_DIR}" || { echo "Deploy directory missing"; exit 1; }
            if [ -d .git ]; then
              git pull origin main
            else
              echo ">> First deploy: cloning repo into ${DEPLOY_DIR}"
              git clone https://github.com/vannius51-dotcom/${APP}.git "${DEPLOY_DIR}"
              cd "${DEPLOY_DIR}"
            fi

            # Find an available port
            port_in_use() {
              ss -ltnH 2>/dev/null | grep -q ":$1 " && return 0
              docker ps --format "{{.Ports}}" 2>/dev/null | grep -q ":$1->" && return 0
              return 1
            }
            HOST_PORT=""
            for p in $(seq ${PORT_START} ${PORT_END}); do
              if ! port_in_use "$p"; then HOST_PORT="$p"; break; fi
            done
            [ -z "${HOST_PORT}" ] && { echo "预留端口区间已全部占用,部署中止"; exit 1; }
            echo ">> Deploying to host port ${HOST_PORT}"

            # Build and run
            docker build -t ${APP}:latest .
            docker rm -f ${APP} 2>/dev/null || true
            docker run -d \
              --name ${APP} \
              --restart unless-stopped \
              -p ${HOST_PORT}:${CONTAINER_PORT} \
              ${APP}:latest

            sleep 5
            curl -fsS "http://localhost:${HOST_PORT}/_stcore/health"
            echo ">> Deploy success: http://${{ secrets.SSH_HOST }}:${HOST_PORT}"
